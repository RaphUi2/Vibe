
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Ultimate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            vibe: {
              blue: '#4facfe',
              purple: '#8a2be2',
              pink: '#f093fb',
              orange: '#f6d365',
            },
            blue: {
              400: 'rgb(var(--vibe-accent) / <alpha-value>)',
              500: 'rgb(var(--vibe-accent) / <alpha-value>)',
              600: 'rgb(var(--vibe-accent) / <alpha-value>)',
            }
          }
        }
      },
      plugins: [
        function({ addVariant }) {
          addVariant('landscape', '@media (orientation: landscape) { .auto-rotate & }');
        }
      ]
    }
  </script>
  <style>
    :root {
      --vibe-accent: 59 130 246;
      --vibe-blue: #4facfe;
      --vibe-purple: #8a2be2;
      --vibe-pink: #f093fb;
      --vibe-orange: #f6d365;
      --glass-bg: rgba(0, 0, 0, 0.4);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    body { 
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif; 
      background-color: #000000; 
      color: #eff3f4; 
      overflow: hidden;
      margin: 0;
    }
    .vibe-logo { font-family: 'Inter', sans-serif; font-weight: 800; text-transform: none; letter-spacing: -0.02em; }
    
    .logo-vibe-text {
      background: linear-gradient(to right, var(--vibe-blue), var(--vibe-purple), var(--vibe-pink), var(--vibe-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .liquid-glass {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    .glass-premium {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .holographic {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05),
        rgba(255, 255, 255, 0.1) 25%,
        rgba(59, 130, 246, 0.2) 50%,
        rgba(139, 92, 246, 0.1) 75%,
        rgba(255, 255, 255, 0.05)
      );
      background-size: 400% 400%;
      animation: holographic-move 8s ease infinite;
    }

    @keyframes holographic-move {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .vibe-gradient-bg {
      background: 
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(240, 147, 251, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(246, 211, 101, 0.05) 0%, transparent 40%),
        #000000;
      background-attachment: fixed;
    }

    .atmosphere {
      background:
        radial-gradient(circle at 50% 30%, rgba(138, 43, 226, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(79, 172, 254, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(246, 211, 101, 0.08) 0%, transparent 50%);
      filter: blur(80px);
      opacity: 0.8;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.2); border-radius: 20px; }

    @keyframes pulse-blue {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .bg-pulse-blue { animation: pulse-blue 4s infinite ease-in-out; }

    @keyframes boost-glow {
      0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0px rgba(59, 130, 246, 0)); }
      50% { transform: scale(1.15); filter: brightness(1.2) drop-shadow(0 0 10px rgba(59, 130, 246, 0.8)); }
      100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0px rgba(59, 130, 246, 0)); }
    }
    .animate-boost { animation: boost-glow 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes boost-pulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.3)); }
      50% { transform: scale(1.02); opacity: 0.9; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
    }
    .animate-boost-pulse { animation: boost-pulse 3s infinite ease-in-out; }

    /* Themes */
    .theme-default { --vibe-accent: 59 130 246; --vibe-glow: rgba(59, 130, 246, 0.5); --bg-color: #020617; }
    .theme-neon_pink { --vibe-accent: 244 114 182; --vibe-glow: rgba(244, 114, 182, 0.5); --bg-color: #1a0512; }
    .theme-gold { --vibe-accent: 251 191 36; --vibe-glow: rgba(251, 191, 36, 0.5); --bg-color: #1a1602; }
    .theme-cyber_ocean { --vibe-accent: 6 182 212; --vibe-glow: rgba(6, 182, 212, 0.5); --bg-color: #01121a; }
    .theme-ruby { --vibe-accent: 225 29 72; --vibe-glow: rgba(225, 29, 72, 0.5); --bg-color: #1a0308; }
    .theme-emerald { --vibe-accent: 16 185 129; --vibe-glow: rgba(16, 185, 129, 0.5); --bg-color: #011a0e; }
    .theme-neon { --vibe-accent: 255 0 255; --vibe-glow: rgba(255, 0, 255, 0.5); --bg-color: #140014; }
    .theme-matrix { --vibe-accent: 0 255 0; --vibe-glow: rgba(0, 255, 0, 0.5); --bg-color: #001400; }
    .theme-obsidian { --vibe-accent: 161 161 170; --vibe-glow: rgba(255, 255, 255, 0.1); --bg-color: #000000; }
    .theme-royal { --vibe-accent: 139 92 246; --vibe-glow: rgba(139, 92, 246, 0.5); --bg-color: #0f051f; }
    .theme-mars { --vibe-accent: 255 69 0; --vibe-glow: rgba(255, 69, 0, 0.5); --bg-color: #1a0500; }
    .theme-atlantis { --vibe-accent: 0 255 255; --vibe-glow: rgba(0, 255, 255, 0.5); --bg-color: #001a1a; }
    .theme-midnight { --vibe-accent: 128 128 128; --vibe-glow: rgba(128, 128, 128, 0.5); --bg-color: #050505; }
    .theme-sakura { --vibe-accent: 255 183 197; --vibe-glow: rgba(255, 183, 197, 0.5); --bg-color: #1a0a0d; }
    .theme-arctic { --vibe-accent: 200 230 255; --vibe-glow: rgba(200, 230, 255, 0.5); --bg-color: #0a0f1a; }
    .theme-jungle { --vibe-accent: 34 139 34; --vibe-glow: rgba(34, 139, 34, 0.5); --bg-color: #051a05; }
    .theme-sunset { --vibe-accent: 255 140 0; --vibe-glow: rgba(255, 140, 0, 0.5); --bg-color: #1a0a00; }
    .theme-void { --vibe-accent: 138 43 226; --vibe-glow: rgba(138, 43, 226, 0.5); --bg-color: #0a001a; }
    .theme-solar { --vibe-accent: 255 255 0; --vibe-glow: rgba(255, 255, 0, 0.5); --bg-color: #1a1a00; }
    .theme-nebula { --vibe-accent: 255 0 255; --vibe-glow: rgba(255, 0, 255, 0.5); --bg-color: #0f001a; }
    .theme-concrete { --vibe-accent: 128 128 128; --vibe-glow: rgba(128, 128, 128, 0.3); --bg-color: #1a1a1a; }
    .theme-lavender { --vibe-accent: 230 190 255; --vibe-glow: rgba(230, 190, 255, 0.5); --bg-color: #100a1a; }
    .theme-coffee { --vibe-accent: 111 78 55; --vibe-glow: rgba(111, 78, 55, 0.5); --bg-color: #1a0f0a; }
    .theme-mint { --vibe-accent: 152 255 152; --vibe-glow: rgba(152, 255, 152, 0.5); --bg-color: #0a1a10; }
    .theme-electric { --vibe-accent: 255 255 51; --vibe-glow: rgba(255, 255, 51, 0.5); --bg-color: #1a1a05; }
    .theme-phantom { --vibe-accent: 192 192 192; --vibe-glow: rgba(192, 192, 192, 0.3); --bg-color: #0a0a0a; }
    .theme-vaporwave { --vibe-accent: 255 113 206; --vibe-glow: rgba(255, 113, 206, 0.5); --bg-color: #1a001a; }
    .theme-steampunk { --vibe-accent: 184 115 51; --vibe-glow: rgba(184, 115, 51, 0.5); --bg-color: #1a1005; }
    .theme-minimal { --vibe-accent: 255 255 255; --vibe-glow: rgba(255, 255, 255, 0.2); --bg-color: #1a1a1a; }
    .theme-cyber_gold { --vibe-accent: 218 165 32; --vibe-glow: rgba(218, 165, 32, 0.5); --bg-color: #1a1200; }
    .theme-nordic { --vibe-accent: 135 206 235; --vibe-glow: rgba(135, 206, 235, 0.5); --bg-color: #0a151a; }
    .theme-supernova { --vibe-accent: 255 100 0; --vibe-glow: rgba(255, 100, 0, 0.5); --bg-color: #1a0a00; }
    .theme-abyss { --vibe-accent: 0 50 150; --vibe-glow: rgba(0, 50, 150, 0.5); --bg-color: #00051a; }
    .theme-cyberpunk_2077 { --vibe-accent: 255 230 0; --vibe-glow: rgba(255, 230, 0, 0.5); --bg-color: #000000; }
    .theme-chrome { --vibe-accent: 200 200 200; --vibe-glow: rgba(200, 200, 200, 0.5); --bg-color: #1a1a1a; }
    .theme-zenith { --vibe-accent: 0 120 255; --vibe-glow: rgba(0, 120, 255, 0.5); --bg-color: #000a1a; }
    .theme-magma { --vibe-accent: 255 60 0; --vibe-glow: rgba(255, 60, 0, 0.5); --bg-color: #1a0500; }
    .theme-aurora { --vibe-accent: 100 255 200; --vibe-glow: rgba(100, 255, 200, 0.5); --bg-color: #001a10; }
    .theme-titan { --vibe-accent: 120 120 150; --vibe-glow: rgba(120, 120, 150, 0.5); --bg-color: #0a0a0f; }
    .theme-onyx { --vibe-accent: 50 50 50; --vibe-glow: rgba(255, 255, 255, 0.1); --bg-color: #000000; }
    .theme-quartz { --vibe-accent: 255 150 200; --vibe-glow: rgba(255, 150, 200, 0.5); --bg-color: #1a0a10; }
    .theme-hyperdrive { --vibe-accent: 0 200 255; --vibe-glow: rgba(0, 200, 255, 0.5); --bg-color: #000a1a; }
    .theme-glitch { --vibe-accent: 150 0 255; --vibe-glow: rgba(150, 0, 255, 0.5); --bg-color: #0a001a; }
    .theme-biohazard { --vibe-accent: 180 255 0; --vibe-glow: rgba(180, 255, 0, 0.5); --bg-color: #0a1a00; }
    .theme-carbon { --vibe-accent: 80 80 80; --vibe-glow: rgba(80, 80, 80, 0.3); --bg-color: #050505; }
    .theme-inferno { --vibe-accent: 255 30 0; --vibe-glow: rgba(255, 30, 0, 0.5); --bg-color: #1a0000; }
    .theme-skyline { --vibe-accent: 50 100 255; --vibe-glow: rgba(50, 100, 255, 0.5); --bg-color: #000a1a; }
    .theme-retro { --vibe-accent: 200 50 255; --vibe-glow: rgba(200, 50, 255, 0.5); --bg-color: #14051a; }
    .theme-ethereal { --vibe-accent: 220 180 255; --vibe-glow: rgba(220, 180, 255, 0.5); --bg-color: #0d0a1a; }
    .theme-genesis { --vibe-accent: 255 255 255; --vibe-glow: rgba(255, 255, 255, 0.3); --bg-color: #1a1a1a; }
    .theme-singularity { --vibe-accent: 255 255 255; --vibe-glow: rgba(255, 255, 255, 0.05); --bg-color: #000000; }

    .theme-bg-gradient {
      background: radial-gradient(circle at 0% 0%, var(--vibe-glow) 0%, transparent 40%),
                  radial-gradient(circle at 100% 100%, rgba(30, 64, 175, 0.05) 0%, transparent 40%),
                  var(--bg-color);
      background-attachment: fixed;
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Terminal & Scanline FX */
    @keyframes scan {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }
    .animate-scan {
      animation: scan 8s linear infinite;
    }
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
    }

    @keyframes gradient-x {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .animate-gradient-x {
      background-size: 200% 200%;
      animation: gradient-x 3s ease infinite;
    }

    /* Power Save Mode */
    body.power-save * {
      animation-duration: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0s !important;
      backdrop-filter: none !important;
      filter: none !important;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4",
      "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="theme-default theme-bg-gradient">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
